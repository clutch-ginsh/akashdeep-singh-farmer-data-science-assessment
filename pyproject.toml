[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akashdeep-singh-farmer-data-science-assessment"
version = "0.1.0"
description = "Wind-tunnel acoustic anomaly detection on the NASA/UCI Airfoil Self-Noise dataset (FARM Data Science Challenge)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akashdeep Singh", email = "747akdsingh@gmail.com" }]
keywords = ["anomaly-detection", "acoustics", "wind-tunnel", "pytorch", "regression"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "seaborn>=0.12",
    "torch>=2.1",
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
